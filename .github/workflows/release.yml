name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    name: Package ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: windows-2022
            rid: win-x64

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          clean: true

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.1.0
        with:
          dotnet-version: 8.0.424

      - name: Verify tag matches application version
        shell: pwsh
        run: |
          $match = Select-String -Path app/BehaviourStudio.csproj -Pattern '<Version>(.*?)</Version>' | Select-Object -First 1
          if (-not $match) { throw 'Application version was not found.' }
          $version = $match.Matches[0].Groups[1].Value
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -ne $tagVersion) {
            throw "Tag $env:GITHUB_REF_NAME does not match app version $version"
          }

      - name: Restore locked release dependencies
        run: dotnet restore app/BehaviourStudio.csproj --locked-mode

      - name: Publish self-contained application
        run: dotnet publish app/BehaviourStudio.csproj --configuration Release --runtime "${{ matrix.rid }}" --self-contained true --no-restore --output "release/${{ matrix.rid }}"

      - name: Include release notices
        shell: pwsh
        run: |
          Copy-Item CHANGELOG.md, LICENSE, THIRD_PARTY_NOTICES.md -Destination "release/${{ matrix.rid }}/"

      - name: Verify Linux executable
        if: matrix.rid == 'linux-x64'
        run: ./release/${{ matrix.rid }}/BehaviourGraphStudio --version

      - name: Verify Windows executable
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: .\release\${{ matrix.rid }}\BehaviourGraphStudio.exe --version

      - name: Archive release
        shell: pwsh
        run: |
          $archive = "BehaviourGraphStudio-${{ github.ref_name }}-${{ matrix.rid }}.zip"
          Compress-Archive -Path "release/${{ matrix.rid }}/*" -DestinationPath $archive -CompressionLevel Optimal

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.rid }}
          path: BehaviourGraphStudio-${{ github.ref_name }}-${{ matrix.rid }}.zip
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download validated archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum BehaviourGraphStudio-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/BehaviourGraphStudio-*.zip

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists. Create a new version instead of replacing it."
            exit 1
          fi

      - name: Publish release last
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            dist/BehaviourGraphStudio-*.zip \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Behaviour Graph Studio ${GITHUB_REF_NAME#v}" \
            --generate-notes
