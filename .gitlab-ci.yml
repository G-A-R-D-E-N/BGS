
stages:
  - test
  - build
  - release

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

variables:
  DOTNET: mcr.microsoft.com/dotnet/sdk:8.0.424
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  PACKAGE_REGISTRY: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/behaviour-graph-studio/${CI_COMMIT_SHORT_SHA}"

.dotnet:
  image: $DOTNET
  cache:
    key: nuget
    paths:
      - .nuget/packages
    when: always

format:
  extends: .dotnet
  stage: test
  script:
    - dotnet test tools/tests/BehaviourGraph.Tests.csproj
    - dotnet run --project tools/symrm/symrm.csproj -- test

window:
  extends: .dotnet
  stage: test
  script:
    - dotnet run --project tools/uismoke/uismoke.csproj

.publish:
  extends: .dotnet
  stage: build
  needs: [format, window]
  script:
    - dotnet publish app/BehaviourStudio.csproj -c Release -r $RID -o out
    - cp LICENSE THIRD_PARTY_NOTICES.md out/
    - ls -la out
    - test -f "out/$BINARY"
    - mv out "BehaviourGraphStudio-$RID"
    - apt-get update -qq && apt-get install -y -qq zip >/dev/null
    - zip -qr "BehaviourGraphStudio-$RID.zip" "BehaviourGraphStudio-$RID"
  artifacts:
    paths:
      - "*.zip"
    expire_in: 1 week

linux:
  extends: .publish
  variables:
    RID: linux-x64
    BINARY: BehaviourGraphStudio

windows:
  extends: .publish
  variables:
    RID: win-x64
    BINARY: BehaviourGraphStudio.exe

standalone:
  stage: build
  image: debian:bookworm-slim
  needs: [linux]
  script:
    - apt-get update -qq && apt-get install -y -qq unzip >/dev/null
    - unzip -q BehaviourGraphStudio-linux-x64.zip
    - cd BehaviourGraphStudio-linux-x64
    - chmod +x BehaviourGraphStudio
    - ./BehaviourGraphStudio --version
    - test -s LICENSE
    - test -s THIRD_PARTY_NOTICES.md

.publishable:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: manual
      allow_failure: true

upload:
  extends: .publishable
  stage: release
  image: curlimages/curl:latest
  needs: [linux, windows, standalone]
  script:
    - |
      for z in BehaviourGraphStudio-linux-x64.zip BehaviourGraphStudio-win-x64.zip; do
        curl -sf --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$z" "$PACKAGE_REGISTRY/$z"
      done

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [upload]
  script:
    - echo "release for $CI_COMMIT_SHORT_SHA"
  release:
    tag_name: "build-$CI_COMMIT_SHORT_SHA"
    description: "Behaviour Graph Studio. One file, nothing to install."
    assets:
      links:
        - name: "Behaviour Graph Studio (Linux x86_64)"
          url: "$PACKAGE_REGISTRY/BehaviourGraphStudio-linux-x64.zip"
        - name: "Behaviour Graph Studio (Windows x86_64)"
          url: "$PACKAGE_REGISTRY/BehaviourGraphStudio-win-x64.zip"
