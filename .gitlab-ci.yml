# Builds the tool for Windows and Linux on GitLab runners.
#
# Both jobs run on the same plain Linux image. Nothing here needs a game install, a game engine, or
# a Windows machine: the Windows build is cross compiled, because a self contained .NET publish
# emits the target's own host binary rather than reusing the build machine's.

stages:
  - test
  - build
  - release

# Merge request pipelines are refused outright rather than half built. The build and test jobs carry
# no rules, so they default to branches and tags and are absent from a merge request pipeline, while
# upload's bare manual fallback matches every pipeline source and gets created anyway. upload then
# needs three jobs that do not exist and GitLab refuses to start anything, which is the error seen
# on merge request 30. Every source branch lives in this project, so its branch pipeline already
# builds the same commits and reports onto the merge request.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

variables:
  DOTNET: mcr.microsoft.com/dotnet/sdk:8.0
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  PACKAGE_REGISTRY: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/behaviour-graph-studio/${CI_COMMIT_SHORT_SHA}"

# The runner is one machine shared with the other projects, so packages are cached rather than
# pulled fresh four times per pipeline.
.dotnet:
  image: $DOTNET
  cache:
    key: nuget
    paths:
      - .nuget/packages
    when: always

# The format layer builds graphs in memory, so this needs no game files or external tools. A red
# gate here stops a broken release being cut.
format:
  extends: .dotnet
  stage: test
  script:
    - dotnet test tools/tests/BehaviourGraph.Tests.csproj
    - dotnet run --project tools/symrm/symrm.csproj -- test

# Builds the real window on a headless display and walks it, so a window that no longer opens fails
# the build instead of reaching a release.
window:
  extends: .dotnet
  stage: test
  script:
    - dotnet run --project tools/uismoke/uismoke.csproj

.publish:
  extends: .dotnet
  stage: build
  needs: [format, window]
  script:
    - dotnet publish app/BehaviourStudio.csproj -c Release -r $RID -o out
    - cp LICENSE THIRD_PARTY_NOTICES.md out/
    - ls -la out
    - test -f "out/$BINARY"
    - mv out "BehaviourGraphStudio-$RID"
    - apt-get update -qq && apt-get install -y -qq zip >/dev/null
    - zip -qr "BehaviourGraphStudio-$RID.zip" "BehaviourGraphStudio-$RID"
  artifacts:
    paths:
      - "*.zip"
    expire_in: 1 week

linux:
  extends: .publish
  variables:
    RID: linux-x64
    BINARY: BehaviourGraphStudio

windows:
  extends: .publish
  variables:
    RID: win-x64
    BINARY: BehaviourGraphStudio.exe

# Proves the Linux build runs on a machine with no .NET and no build tools, which is the whole
# claim of a standalone binary. The Windows one cannot be run here.
standalone:
  stage: build
  image: debian:bookworm-slim
  needs: [linux]
  script:
    - apt-get update -qq && apt-get install -y -qq unzip >/dev/null
    - unzip -q BehaviourGraphStudio-linux-x64.zip
    - cd BehaviourGraphStudio-linux-x64
    - chmod +x BehaviourGraphStudio
    - ./BehaviourGraphStudio --version
    - test -s LICENSE
    - test -s THIRD_PARTY_NOTICES.md

# On main these run on their own, which is how a merge cuts a release. Anywhere else they wait
# for somebody to press play in the pipeline view, so a branch can be handed to a tester as a real
# download without merging it first. allow_failure keeps an unpressed button from holding the
# pipeline open or reading as a failure.
.publishable:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: manual
      allow_failure: true

upload:
  extends: .publishable
  stage: release
  image: curlimages/curl:latest
  needs: [linux, windows, standalone]
  script:
    - |
      for z in BehaviourGraphStudio-linux-x64.zip BehaviourGraphStudio-win-x64.zip; do
        curl -sf --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$z" "$PACKAGE_REGISTRY/$z"
      done

# Not manual itself: it needs upload, so on a branch it simply follows once upload has been
# pressed, and stays skipped while upload does. One button, not two.
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [upload]
  script:
    - echo "release for $CI_COMMIT_SHORT_SHA"
  release:
    tag_name: "build-$CI_COMMIT_SHORT_SHA"
    description: "Behaviour Graph Studio. One file, nothing to install."
    assets:
      links:
        - name: "Behaviour Graph Studio (Linux x86_64)"
          url: "$PACKAGE_REGISTRY/BehaviourGraphStudio-linux-x64.zip"
        - name: "Behaviour Graph Studio (Windows x86_64)"
          url: "$PACKAGE_REGISTRY/BehaviourGraphStudio-win-x64.zip"
